<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roja Islam - Income Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="profile-box">
            <div class="avatar-container">
                <img src="https://github.com/rojaislam1619-collab.png" alt="Profile" class="avatar">
            </div>
            <h1>Roja Islam Income</h1>
            <p class="subtitle">সহজে টাস্ক পূরণ করে ইনকাম করুন</p>
        </div>

        <div class="balance-box">
            Your Balance
            <div class="balance-amount" id="balanceDisplay">৳ ০.০০</div>
        </div>

        <div class="menu-container">
            <a href="https://www.youtube.com/watch?v=zwufAOq4Ask" class="task-btn" id="taskBtn">⚡ Start Daily Task</a>

            <a href="#" class="task-btn" id="withdrawBtn" style="background-color: #ff477e; border: 1px solid #ff477e;">💸 Withdraw (টাকা তুলুন)</a>
            
            <a href="https://t.me/+Tdq2zFmwi605ZDY1" class="task-btn">🔵 Join Telegram Group</a>
            <a href="https://youtube.com/@dabang_bd?si=B_LwwwZuD3l-j-az" class="task-btn">🔴 YouTube Channel</a>
        </div>

        <div style="margin-top: 25px; color: #a0aec0; font-size: 14px; border-top: 1px solid #334155; padding-top: 15px;">
            👥 মোট ভিজিটর: <img src="https://profile-counter.glitch.me/rojaislam1619-collab/count.svg" alt="Views" style="vertical-align: middle; margin-left: 5px;">
        </div>
    </div>

    <script>
        const rewardAmount = 5.00; 
        const minimumWithdraw = 50.00; 
        
        let currentBalance = parseFloat(localStorage.getItem('userBalance')) || 0.00;
        
        function updateBalanceDisplay() {
            document.getElementById('balanceDisplay').innerText = "৳ " + currentBalance.toFixed(2);
        }
        
        updateBalanceDisplay();

        document.getElementById('taskBtn').addEventListener('click', function() {
            currentBalance += rewardAmount;
            localStorage.setItem('userBalance', currentBalance);
            updateBalanceDisplay();
            alert("অভিনন্দন! আপনার টাস্কের " + rewardAmount + " টাকা সফলভাবে যোগ হয়েছে।");
        });

        document.getElementById('withdrawBtn').addEventListener('click', function(e) {
            e.preventDefault(); 
            
            if (currentBalance < minimumWithdraw) {
                alert("দুঃখিত! টাকা তোলার জন্য আপনার অ্যাকাউন্টে সর্বনিম্ন ৳ " + minimumWithdraw + " থাকতে হবে। আপনার বর্তমান ব্যালেন্স ৳ " + currentBalance.toFixed(2));
                return;
            }
            
            let method = prompt("টাকা নেওয়ার মাধ্যমটি লিখুন:\n১. bKash (বিকাশ)\n২. Nagad (নগদ)");
            if (!method) return;

            let number = prompt("আপনার " + method + " নাম্বারটি দিন:");
            if (!number) return;

            let amountStr = prompt("কত টাকা তুলতে চান লিখুন (সর্বোচ্চ: ৳ " + currentBalance.toFixed(2) + "):");
            let amount = parseFloat(amountStr);

            if (isNaN(amount) || amount <= 0 || amount > currentBalance) {
                alert("ভুল টাকার পরিমাণ দিয়েছেন! আবার চেষ্টা করুন।");
                return;
            }

            currentBalance -= amount;
            localStorage.setItem('userBalance', currentBalance);
            updateBalanceDisplay();

            alert("আপনার উইথড্র রিকোয়েস্টটি সফল হয়েছে!\n\nমাধ্যম: " + method + "\nনাম্বার: " + number + "\nপরিমাণ: ৳ " + amount.toFixed(2) + "\n\nআগামী ২৪ ঘণ্টার মধ্যে আপনার টাকা পাঠিয়ে দেওয়া হবে। ধন্যবাদ!");
        });
    </script>
</body>
</html>
